name: Racing EV Lab tests

on:
  push:
    branches: [racing-ev-lab]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app.py racing_ev scripts tests
      - name: Run tests
        run: pytest -q
